<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="320" viewBox="0 0 640 320">
  <title>Seven-step AI use decision flow ending in green, amber, or red</title>
  <desc>Flow from purpose through people, data, tool, verification, human control, and monitoring to a traffic-light decision recorded with an owner.</desc>
  <rect width="640" height="320" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" font-size="11" fill="#1a1a1a">
    <rect x="8" y="20" width="78" height="36" rx="4" fill="#e8f0fe" stroke="#3366cc"/>
    <text x="47" y="42" text-anchor="middle">Purpose</text>
    <rect x="96" y="20" width="78" height="36" rx="4" fill="#e8f0fe" stroke="#3366cc"/>
    <text x="135" y="42" text-anchor="middle">People</text>
    <rect x="184" y="20" width="78" height="36" rx="4" fill="#e8f0fe" stroke="#3366cc"/>
    <text x="223" y="42" text-anchor="middle">Data</text>
    <rect x="272" y="20" width="78" height="36" rx="4" fill="#e8f0fe" stroke="#3366cc"/>
    <text x="311" y="42" text-anchor="middle">Tool</text>
    <rect x="360" y="20" width="88" height="36" rx="4" fill="#e8f0fe" stroke="#3366cc"/>
    <text x="404" y="42" text-anchor="middle">Verification</text>
    <rect x="458" y="20" width="88" height="36" rx="4" fill="#e8f0fe" stroke="#3366cc"/>
    <text x="502" y="38" text-anchor="middle">Human</text>
    <text x="502" y="50" text-anchor="middle">control</text>
    <rect x="556" y="20" width="76" height="36" rx="4" fill="#e8f0fe" stroke="#3366cc"/>
    <text x="594" y="42" text-anchor="middle">Monitor</text>
    <path d="M86 38 H96 M174 38 H184 M262 38 H272 M350 38 H360 M448 38 H458 M546 38 H556" stroke="#666" fill="none"/>
    <path d="M320 56 V88" stroke="#666" fill="none" marker-end="url(#arrow)"/>
    <rect x="240" y="88" width="160" height="40" rx="4" fill="#fff3cd" stroke="#996600"/>
    <text x="320" y="114" text-anchor="middle">Record G / A / R with owner</text>
    <rect x="40" y="160" width="160" height="48" rx="4" fill="#d4edda" stroke="#2d6a4f"/>
    <text x="120" y="182" text-anchor="middle">Green: proceed</text>
    <text x="120" y="198" text-anchor="middle">with checks</text>
    <rect x="240" y="160" width="160" height="48" rx="4" fill="#fff3cd" stroke="#996600"/>
    <text x="320" y="182" text-anchor="middle">Amber: pause</text>
    <text x="320" y="198" text-anchor="middle">for review</text>
    <rect x="440" y="160" width="160" height="48" rx="4" fill="#f8d7da" stroke="#842029"/>
    <text x="520" y="182" text-anchor="middle">Red: stop</text>
    <text x="520" y="198" text-anchor="middle">unsafe use</text>
    <path d="M280 128 L120 160 M320 128 V160 M360 128 L520 160" stroke="#666" fill="none"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
